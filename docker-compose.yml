services:
  db:
    image: postgres:${POSTGRES_VERSION:-15}-alpine
    container_name: ${CONTAINER_PREFIX:-pg_transparencia_brasil_dev}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CRAWLER_DB_NAME:-trans_brazil_crawler}
      POSTGRES_USER: ${DOCKER_DB_USER:-foo_user}
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD:-foo_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${CRAWLER_DB_PORT:-5433}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DOCKER_DB_USER:-foo_user}:${DOCKER_DB_PASSWORD:-foo_password}@db:5432/${CRAWLER_DB_NAME:-trans_brazil_crawler}
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  postgres_data: